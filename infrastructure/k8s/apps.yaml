apiVersion: apps/v1
kind: Deployment
metadata:
  name: depot
  namespace: borderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: depot
  template:
    metadata:
      labels:
        app: depot
    spec:
      containers:
        - name: depot
          image: borderflow:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.depot.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: borderflow-config
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: depot
  namespace: borderflow
spec:
  selector:
    app: depot
  ports:
    - port: 8000
      targetPort: 8000
---
