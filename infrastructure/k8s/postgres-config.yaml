apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: borderflow
data:
  init-multiple-dbs.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    DO
    $$
    BEGIN
       IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'bf_user') THEN
          CREATE ROLE bf_user LOGIN PASSWORD 'bf_password';
       END IF;
    END
    $$;
    SQL

    for db in borderflow_depot borderflow_border borderflow_port borderflow_destination; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    SELECT 'CREATE DATABASE ${db} OWNER bf_user'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${db}')\gexec
    SQL

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "${db}" -f /docker-entrypoint-initdb.d/schema.sql
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "${db}" <<'SQL'
    ALTER SCHEMA public OWNER TO bf_user;
    GRANT USAGE, CREATE ON SCHEMA public TO bf_user;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO bf_user;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO bf_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO bf_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO bf_user;
    SQL
    done
  schema.sql: |
    CREATE TABLE IF NOT EXISTS events (
        event_id TEXT PRIMARY KEY,
        container_id TEXT NOT NULL,
        site_id TEXT NOT NULL,
        event_type TEXT NOT NULL,
        payload JSONB NOT NULL DEFAULT '{}'::jsonb,
        timestamp TIMESTAMPTZ NOT NULL,
        sync_status TEXT NOT NULL,
        sequence_number INTEGER
    );

    CREATE TABLE IF NOT EXISTS container_state (
        container_id TEXT PRIMARY KEY,
        current_location TEXT NOT NULL,
        last_event TEXT NOT NULL,
        last_updated TIMESTAMPTZ NOT NULL
    );

    CREATE TABLE IF NOT EXISTS outbox_events (
        event_id TEXT PRIMARY KEY,
        source_site_id TEXT NOT NULL,
        routing_key TEXT NOT NULL,
        payload JSONB NOT NULL,
        status TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL,
        sent_at TIMESTAMPTZ
    );

    CREATE TABLE IF NOT EXISTS inbox_events (
        event_id TEXT PRIMARY KEY,
        source_site_id TEXT NOT NULL,
        payload JSONB NOT NULL,
        received_at TIMESTAMPTZ NOT NULL
    );

    GRANT USAGE, CREATE ON SCHEMA public TO bf_user;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO bf_user;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO bf_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO bf_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO bf_user;
