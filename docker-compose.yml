services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "55672:5672"
      - "15673:15672"

  depot:
    build: .
    depends_on:
      - postgres
      - rabbitmq
    environment:
      BORDERFLOW_API_KEYS: depot-controller-demo-key:depot_operations_controller,truck-driver-demo-key:truck_driver,yard-clerk-demo-key:yard_depot_clerk,border-liaison-demo-key:border_liaison,port-agent-demo-key:port_agent,management-demo-key:management_compliance,client-demo-key:customer_service_client
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEPOT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_depot
      BORDER_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_border
      PORT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_port
      DESTINATION_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_destination
    command: python -m uvicorn services.depot.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  border:
    build: .
    depends_on:
      - postgres
      - rabbitmq
    environment:
      BORDERFLOW_API_KEYS: depot-controller-demo-key:depot_operations_controller,truck-driver-demo-key:truck_driver,yard-clerk-demo-key:yard_depot_clerk,border-liaison-demo-key:border_liaison,port-agent-demo-key:port_agent,management-demo-key:management_compliance,client-demo-key:customer_service_client
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEPOT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_depot
      BORDER_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_border
      PORT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_port
      DESTINATION_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_destination
    command: python -m uvicorn services.border.api.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  port:
    build: .
    depends_on:
      - postgres
      - rabbitmq
    environment:
      BORDERFLOW_API_KEYS: depot-controller-demo-key:depot_operations_controller,truck-driver-demo-key:truck_driver,yard-clerk-demo-key:yard_depot_clerk,border-liaison-demo-key:border_liaison,port-agent-demo-key:port_agent,management-demo-key:management_compliance,client-demo-key:customer_service_client
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEPOT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_depot
      BORDER_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_border
      PORT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_port
      DESTINATION_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_destination
    command: python -m uvicorn services.port.api.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"

  destination:
    build: .
    depends_on:
      - postgres
      - rabbitmq
    environment:
      BORDERFLOW_API_KEYS: depot-controller-demo-key:depot_operations_controller,truck-driver-demo-key:truck_driver,yard-clerk-demo-key:yard_depot_clerk,border-liaison-demo-key:border_liaison,port-agent-demo-key:port_agent,management-demo-key:management_compliance,client-demo-key:customer_service_client
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEPOT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_depot
      BORDER_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_border
      PORT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_port
      DESTINATION_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_destination
    command: python -m uvicorn services.destination.api.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"

  control-tower:
    build: .
    depends_on:
      - postgres
      - rabbitmq
      - depot
      - border
      - port
      - destination
    environment:
      BORDERFLOW_API_KEYS: depot-controller-demo-key:depot_operations_controller,truck-driver-demo-key:truck_driver,yard-clerk-demo-key:yard_depot_clerk,border-liaison-demo-key:border_liaison,port-agent-demo-key:port_agent,management-demo-key:management_compliance,client-demo-key:customer_service_client
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEPOT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_depot
      BORDER_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_border
      PORT_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_port
      DESTINATION_DATABASE_URL: postgresql://bf_user:bf_password@postgres:5432/borderflow_destination
      DEPOT_SERVICE_URL: http://depot:8000/health
      BORDER_SERVICE_URL: http://border:8001/health
      PORT_SERVICE_URL: http://port:8002/health
      DESTINATION_SERVICE_URL: http://destination:8003/health
    command: python -m uvicorn services.controltower.api.main:app --host 0.0.0.0 --port 8010
    ports:
      - "8010:8010"

volumes:
  postgres_data:
